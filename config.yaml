document_parser:
  max_pages: null  # null for unlimited
  extract_images: false
  extract_tables: true

claim_extractor:
  min_claim_length: 10
  max_claim_length: 500
  use_patterns: true

citation_linker:
  formats:
    - APA
    - MLA
    - Chicago
  extract_doi: true
  extract_urls: true

confidence_scorer:
  min_confidence: 0.0
  use_citation_count: true
  use_author_authority: false

graph_builder:
  format: gexf  # gexf, graphml, json
  include_metadata: true
  max_nodes: 10000
